[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zpermit-backend"
version = "0.1.0"
description = "ZPermit spending authorization API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "toon-format>=1.2,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
